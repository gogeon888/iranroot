# 解包 project.zip 并构建 Debug APK（不装 SDK：GitHub runner 自带 Android SDK）
name: Build from project.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          set -e
          ls -la
          unzip -o project.zip -d _unpack
          cp -rf _unpack/RootMyVivo/. .
          rm -rf _unpack project.zip
          test -f gradlew
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5 || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | tail -3 || true
          ls -la app/src/main/jniLibs/arm64-v8a/ | head -12

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yiran-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
