name: Build from project.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          set -e
          unzip -o project.zip -d _unpack
          cp -rf _unpack/RootMyVivo/. .
          rm -rf _unpack project.zip
          test -f gradlew
          chmod +x gradlew

      - name: Use fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Report APK
        if: always()
        run: sha256sum app/build/outputs/apk/debug/*.apk || true

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: 依然一键root v1.0 (build ${{ github.run_number }})
          body: |
            自动构建产物（固定 debug 签名 · 可覆盖安装）。
            基于 RootMyVivo 外壳 + GhostLock 引擎 + 无痕一键root 载荷链。
            署名：YuKongA ｜ 酷安@寂寞夜无痕 ｜ zenyxx-xd ｜ 酷安@依然饭后吸
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yiran-debug-apk
          path: app/build/outputs/apk/debug/*.apk
