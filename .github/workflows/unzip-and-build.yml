name: Build from project.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          set -e
          unzip -o project.zip -d _unpack
          cp -rf _unpack/RootMyVivo/. .
          rm -rf _unpack project.zip
          test -f gradlew
          chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ① 打印校验信息
      - name: Report APK
        if: always()
        run: |
          ls -l app/build/outputs/apk/debug/ || true
          sha256sum app/build/outputs/apk/debug/*.apk || true

      # ② 发布到 Release（公开仓库无需登录即可下载）
      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: 依然一键root v1.0 (build ${{ github.run_number }})
          body: |
            自动构建产物（debug 签名）。基于 RootMyVivo 外壳 + GhostLock 引擎 + 无痕一键root 载荷链。
            署名：GhostLock 原作者 YuKongA ｜ 无痕一键root 作者 酷安@寂寞夜无痕 ｜ RootMyVivo 作者 zenyxx-xd ｜ 整合 酷安@依然饭后吸
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

      # ③ 备用：传到公开直链（无需登录），并把链接打进日志
      - name: Fallback public link
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "=== 备用直链 ==="
          curl -sS --max-time 120 -F "file=@$APK" https://0x0.st || echo "(0x0.st 不可用，忽略)"
          echo "=== 备用直链结束 ==="
          curl -sS --max-time 120 --upload-file "$APK" https://transfer.sh/yiran-root.apk || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yiran-debug-apk
          path: app/build/outputs/apk/debug/*.apk
